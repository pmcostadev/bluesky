name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push cancels the first run rather than queueing behind it. Cancelled
# runs show as cancelled, not failed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install`, not `npm ci`. This project pins @atproto/jwk through
      # `overrides` to keep exactly one copy in the tree, and npm ci refuses to
      # run at all when a committed lockfile predates a change like that. Fresh
      # resolution is also what Vercel does, so CI matches production.
      - name: Install
        run: npm install

      # Build first: it generates next-env.d.ts and the route types that a
      # standalone tsc run needs. Running tsc before this fails on missing
      # generated types rather than on anything real. `next build` also
      # typechecks, so a type error fails here too.
      - name: Build
        run: npm run build
        env:
          OAUTH_PUBLIC_ORIGIN: https://ci.example
          OAUTH_SIGNING_SECRET: ci-placeholder-secret-not-used-anywhere-32
          KV_REST_API_URL: https://ci.example
          KV_REST_API_TOKEN: ci-placeholder

      - name: Typecheck
        run: npx tsc --noEmit
